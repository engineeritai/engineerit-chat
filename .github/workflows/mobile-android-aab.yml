name: Mobile Android AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-aab.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-aab.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install npm dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing and Firebase secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload keystore from ANDROID_KEYSTORE_BASE64."
          else
            echo "ANDROID_KEYSTORE_BASE64 is not set. The AAB will be unsigned and cannot be uploaded to Play."
          fi
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/android/app/google-services.json
            echo "Wrote google-services.json from ANDROID_GOOGLE_SERVICES_JSON_BASE64."
          else
            echo "ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not set. The app still builds. Android push registration needs this file."
          fi

      - name: Build release AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: engineerit-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
